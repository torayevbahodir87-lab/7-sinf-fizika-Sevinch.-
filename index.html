r:2px solid var(--ln);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:12px;cursor:pointer}\nnav button.on,.tabs button.on,.opt button.on{background:var(--pri);border-color:var(--pri);color:#fff}\nmain{max-width:900px;margin:auto;padding:12px 16px 40px}\nsection{display:none}section.on{display:block}\nh2{font-size:clamp(20px,4vw,28px);margin:14px 0 6px}h3{margin:0 0 8px;font-size:18px}\n.card{background:var(--card);border:2px solid var(--ln);border-radius:16px;padding:14px;margin:14px 0}\n.th{font-size:17px;max-width:70ch}\nsvg{width:100%;height:auto;display:block;max-height:300px}\n.w{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}\n.lab{fill:var(--ink);font:12px sans-serif}\nlabel{display:block;font-weight:700;margin:8px 0 2px}\ninput[type=range]{width:100%;accent-color:var(--pri)}\nbutton.b,.tabs button,.opt button{font:inherit;font-weight:700;border:2px solid var(--pri);background:var(--card);color:var(--pri);padding:8px 14px;border-radius:10px;cursor:pointer;margin:4px 4px 4px 0}\nbutton.b{background:var(--pri);color:#fff}\n.tabs{display:flex;flex-wrap:wrap}.pane{display:none}.pane.on{display:block}\n.out{background:var(--bg);border-radius:10px;padding:8px 12px;font-weight:700;margin-top:8px}\n.fact{border-left:6px solid var(--acc);background:var(--card);border-radius:0 12px 12px 0;padding:10px 14px;margin:14px 0}\n.idea{background:var(--pri);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700}\n.qq{margin:12px 0}.qq button{display:block;width:100%;text-align:left;font:inherit;border:2px solid var(--ln);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:10px;margin:6px 0;cursor:pointer}\n.qq button.ok{background:var(--ok);border-color:var(--ok);color:#fff}.qq button.bad{background:var(--bad);border-color:var(--bad);color:#fff}\n.fb{margin:2px 0;color:var(--mut);font-size:14px}\n.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}\n.node{width:78px;text-align:center;font-size:12px;font-weight:700;opacity:.3;transition:.4s}\n.node span{display:grid;place-items:center;width:56px;height:56px;margin:auto;border-radius:50%;background:var(--bg);border:3px solid var(--ln);font-size:26px}\n.node.on{opacity:1}.node.on span{border-color:var(--acc);box-shadow:0 0 14px var(--acc);transform:scale(1.12)}\n.row{display:grid;grid-template-columns:78px 1fr 92px;gap:8px;align-items:center;margin:6px 0;font-size:14px}\n.row i{display:block;height:16px;border-radius:8px;background:var(--pri);transition:width .3s}.row.old i{background:var(--mut)}.row em{font-style:normal;font-weight:700;text-align:right}\n.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}\n.fly{animation:fly 3s ease-in-out infinite alternate}@keyframes fly{to{transform:translateX(230px)}}\n.go{animation:go 4s linear infinite}@keyframes go{from{transform:translateX(-100px)}to{transform:translateX(320px)}}\n.pul{animation:pu 1.2s ease-in-out infinite}@keyframes pu{50%{opacity:.2}}\n.dash{stroke-dasharray:6 6;animation:da 1s linear infinite}@keyframes da{to{stroke-dashoffset:-12}}\n.draw{stroke-dasharray:900;animation:dw 8s linear infinite}@keyframes dw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}\n.a1{animation:sw 2.4s ease-in-out infinite alternate}.a2{animation:sw2 1.6s ease-in-out infinite alternate}\n@keyframes sw{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}@keyframes sw2{from{transform:rotate(-20deg)}to{transform:rotate(25deg)}}\n.l{fill:#dbe7f8}.d{fill:#8aa8d4}.try{fill:var(--acc)!important}.pick{fill:var(--ok)!important}\n.conc{border-top:6px solid var(--pri)}\n.big{font-size:44px;font-weight:900;color:var(--pri)}\n@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003cdiv>\u003ch1>Fizika va texnologiya\u003c/h1>\u003cp>5–6-sinf uchun interaktiv dars: tajriba qil, kuzat, o'rgan!\u003c/p>\u003c/div>\u003cdiv class=\"chip\">Ball: \u003cspan id=\"sc\">0\u003c/span>/6\u003c/div>\u003c/header>\n\u003cnav>\u003cbutton>1. O'zaro bog'liqlik\u003c/button>\u003cbutton>2. Afzalliklar\u003c/button>\u003cbutton>3. Bugun va ertaga\u003c/button>\u003cbutton>Xulosa\u003c/button>\u003c/nav>\n\u003cmain>\n\n\u003csection class=\"on\">\n\u003ch2>1. Fizika va texnologiyaning o'zaro bog'liqligi\u003c/h2>\n\u003cp class=\"th\">Fizika tabiat qonunlarini o'rganadi: elektr, magnit, yorug'lik va harakatni. Olimlar bu qonunlarni tajribalar orqali kashf etadi. Texnologiya esa shu qonunlardan foydalanib, odamlarga kerakli qurilmalarni yaratadi. Masalan, elektr va magnit haqidagi bilimlar generator va lampochkaga aylandi.\u003c/p>\n\u003cdiv class=\"idea\">Asosiy g'oya: fizika qonunlarni kashf etadi, texnologiya ularni amalda qo'llaydi.\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Simulyatsiya: elektr zanjiri\u003c/h3>\n\u003csvg viewBox=\"0 0 320 180\">\u003cpath class=\"w\" d=\"M40 80V40H142M178 40H280V140H190M130 140H40V92\"/>\n\u003cline class=\"w\" x1=\"26\" y1=\"80\" x2=\"54\" y2=\"80\"/>\u003cline class=\"w\" x1=\"33\" y1=\"92\" x2=\"47\" y2=\"92\"/>\n\u003ctext class=\"lab\" x=\"58\" y=\"88\">Batareya\u003c/text>\n\u003ccircle id=\"glow\" cx=\"160\" cy=\"40\" r=\"42\" fill=\"#ffb703\" opacity=\"0\"/>\n\u003ccircle cx=\"160\" cy=\"40\" r=\"18\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"4\"/>\u003cpath class=\"w\" d=\"M148 52L172 28M148 28L172 52\" stroke-width=\"2\"/>\n\u003ctext class=\"lab\" x=\"136\" y=\"95\">Lampochka\u003c/text>\n\u003cg id=\"sw\" style=\"transform-origin:130px 140px;transition:transform .3s\">\u003cline class=\"w\" x1=\"130\" y1=\"140\" x2=\"190\" y2=\"140\"/>\u003c/g>\n\u003ccircle cx=\"130\" cy=\"140\" r=\"4\" fill=\"var(--ink)\"/>\u003ccircle cx=\"190\" cy=\"140\" r=\"4\" fill=\"var(--ink)\"/>\u003ctext class=\"lab\" x=\"150\" y=\"165\">Kalit\u003c/text>\u003c/svg>\n\u003clabel>Kuchlanish: \u003cspan id=\"vo\">6\u003c/span> V\u003c/label>\u003cinput id=\"v\" type=\"range\" min=\"0\" max=\"12\" value=\"6\">\n\u003cbutton class=\"b\" id=\"kal\">Kalitni yoqish/o'chirish\u003c/button>\n\u003cdiv class=\"out\">Tok kuchi: \u003cspan id=\"io\">\u003c/span> A &nbsp;(lampa qarshiligi 6 Ω, tok = kuchlanish ÷ qarshilik)\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Animatsiya: magnitdan uygacha\u003c/h3>\n\u003cdiv class=\"chain\" id=\"chain\">\u003c/div>\n\u003cp class=\"out\" id=\"cd\">\u003c/p>\u003cbutton class=\"b\" id=\"nx\">Keyingi qadam\u003c/button>\u003cbutton class=\"b\" id=\"rs\" style=\"background:var(--mut);border-color:var(--mut)\">Qaytadan\u003c/button>\u003c/div>\n\u003cdiv class=\"fact\">💡 \u003cb>Bilasizmi?\u003c/b> Generator ichida magnit aylansa, simda elektr toki hosil bo'ladi — buni Faradey 1831-yilda kashf etgan. Uyingizdagi rozetkada kuchlanish 220 V, oddiy batareyadan (1,5 V) taxminan 150 marta ko'p!\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Test\u003c/h3>\u003cdiv class=\"quiz\" data-s=\"0\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>2. Fan va texnologiyaning afzalliklari\u003c/h2>\n\u003cp class=\"th\">Fan va texnologiya hayotimizni tezroq, xavfsizroq va qulayroq qiladi. Poyezd va samolyotlar uzoq masofani tez bosib o'tishga yordam beradi. Sun'iy yo'ldoshlar aloqa va ob-havo bashorati uchun xizmat qiladi. Tibbiyotda MRT odamni kesmasdan tananing ichini ko'rish imkonini beradi.\u003c/p>\n\u003cdiv class=\"card\">\u003ch3>Simulyatsiya: quyosh paneli\u003c/h3>\n\u003csvg viewBox=\"0 0 320 190\">\u003crect width=\"320\" height=\"190\" rx=\"10\" fill=\"#9fd0ff\" opacity=\".35\"/>\n\u003cpath d=\"M30 170A130 130 0 0 1 290 170\" fill=\"none\" stroke=\"var(--mut)\" stroke-dasharray=\"4 5\"/>\n\u003cline id=\"beam\" x1=\"160\" y1=\"40\" x2=\"160\" y2=\"152\" stroke=\"#ffb703\" stroke-width=\"3\" class=\"dash\"/>\n\u003cg id=\"sun\">\u003ccircle r=\"16\" fill=\"#ffb703\"/>\u003ccircle r=\"24\" fill=\"none\" stroke=\"#ffb703\" stroke-width=\"3\" stroke-dasharray=\"3 6\"/>\u003c/g>\n\u003cpolygon points=\"115,152 205,152 215,172 105,172\" fill=\"#1f4e9c\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\n\u003cpath d=\"M135 152L130 172M160 152V172M185 152L190 172M110 162H210\" stroke=\"#8fb4ff\" stroke-width=\"1.5\"/>\n\u003crect x=\"20\" y=\"8\" width=\"280\" height=\"10\" rx=\"5\" fill=\"var(--ln)\"/>\u003crect id=\"bar\" x=\"20\" y=\"8\" width=\"140\" height=\"10\" rx=\"5\" fill=\"var(--ok)\"/>\u003c/svg>\n\u003clabel>Quyosh balandligi: \u003cspan id=\"ao\">50\u003c/span>°\u003c/label>\u003cinput id=\"ang\" type=\"range\" min=\"10\" max=\"90\" value=\"50\">\n\u003clabel>Yorug'lik miqdori: \u003cspan id=\"lo\">80\u003c/span>%\u003c/label>\u003cinput id=\"lg\" type=\"range\" min=\"0\" max=\"100\" value=\"80\">\n\u003cdiv class=\"out\">Ishlab chiqarilgan energiya: \u003cspan id=\"po\">\u003c/span> Vt (eng ko'pi 300 Vt)\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Animatsiyalar\u003c/h3>\n\u003cdiv class=\"tabs\">\u003cbutton class=\"on\">🚆 Poyezd\u003c/button>\u003cbutton>♨️ Mikroto'lqinli pech\u003c/button>\u003cbutton>🛰️ Yo'ldosh\u003c/button>\u003cbutton>🩻 MRT\u003c/button>\u003c/div>\n\u003cdiv class=\"pane on\">\u003csvg viewBox=\"0 0 300 130\">\u003cline class=\"w\" x1=\"0\" y1=\"100\" x2=\"300\" y2=\"100\"/>\u003cg class=\"go\" id=\"tr\">\u003crect x=\"0\" y=\"60\" width=\"90\" height=\"34\" rx=\"8\" fill=\"var(--pri)\"/>\u003crect x=\"8\" y=\"68\" width=\"14\" height=\"12\" fill=\"#fff\"/>\u003crect x=\"30\" y=\"68\" width=\"14\" height=\"12\" fill=\"#fff\"/>\u003crect x=\"52\" y=\"68\" width=\"14\" height=\"12\" fill=\"#fff\"/>\u003cpath d=\"M90 94V72q14 0 20 22z\" fill=\"var(--pri)\"/>\u003ccircle cx=\"20\" cy=\"98\" r=\"6\" fill=\"var(--ink)\"/>\u003ccircle cx=\"70\" cy=\"98\" r=\"6\" fill=\"var(--ink)\"/>\u003c/g>\u003c/svg>\n\u003clabel>Poyezd tezligi: \u003cspan id=\"so\">100\u003c/span> km/soat\u003c/label>\u003cinput id=\"sp\" type=\"range\" min=\"20\" max=\"300\" value=\"100\">\u003c/div>\n\u003cdiv class=\"pane\">\u003csvg viewBox=\"0 0 300 130\">\u003crect x=\"40\" y=\"20\" width=\"220\" height=\"100\" rx=\"10\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"4\"/>\u003ccircle cx=\"130\" cy=\"75\" r=\"34\" fill=\"none\" stroke=\"var(--mut)\" stroke-width=\"3\"/>\u003cg class=\"spin\" style=\"transform-origin:130px 75px;animation-duration:5s\">\u003ccircle cx=\"130\" cy=\"50\" r=\"9\" fill=\"#e07b39\"/>\u003c/g>\u003cpath class=\"w pul\" d=\"M200 40q10-10 20 0t20 0M200 70q10-10 20 0t20 0M200 100q10-10 20 0t20 0\" stroke=\"#d93a3a\"/>\u003ctext class=\"lab\" x=\"190\" y=\"30\">to'lqinlar → ovqat isiydi\u003c/text>\u003c/svg>\u003c/div>\n\u003cdiv class=\"pane\">\u003csvg viewBox=\"0 0 300 130\">\u003cellipse cx=\"150\" cy=\"65\" rx=\"110\" ry=\"45\" fill=\"none\" stroke=\"var(--mut)\" stroke-dasharray=\"4 5\"/>\u003ccircle cx=\"150\" cy=\"65\" r=\"24\" fill=\"#2f7bd6\"/>\u003cpath d=\"M135 58q8-8 14 0t8 8-8 10z\" fill=\"#3cb371\"/>\u003cg class=\"spin\" style=\"transform-origin:150px 65px;animation-duration:7s\">\u003crect x=\"252\" y=\"60\" width=\"16\" height=\"10\" fill=\"var(--acc)\"/>\u003crect x=\"246\" y=\"63\" width=\"28\" height=\"4\" fill=\"var(--ink)\"/>\u003c/g>\u003ctext class=\"lab\" x=\"100\" y=\"125\">Yer tortishishi yo'ldoshni orbitada ushlaydi\u003c/text>\u003c/svg>\u003c/div>\n\u003cdiv class=\"pane\">\u003csvg viewBox=\"0 0 300 130\">\u003ccircle cx=\"150\" cy=\"62\" r=\"48\" fill=\"none\" stroke=\"var(--mut)\" stroke-width=\"10\"/>\u003cg class=\"spin\" style=\"transform-origin:150px 62px;animation-duration:3s\">\u003ccircle cx=\"150\" cy=\"14\" r=\"7\" fill=\"var(--bad)\"/>\u003ccircle cx=\"150\" cy=\"110\" r=\"7\" fill=\"var(--pri)\"/>\u003c/g>\u003crect x=\"60\" y=\"56\" width=\"180\" height=\"12\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\u003ccircle cx=\"90\" cy=\"62\" r=\"10\" fill=\"var(--acc)\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\u003ctext class=\"lab\" x=\"70\" y=\"126\">Kuchli magnit tana ichini suratga oladi\u003c/text>\u003c/svg>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Taqqoslash: oldin va keyin\u003c/h3>\n\u003clabel>Masofa: \u003cspan id=\"dv\">300\u003c/span> km\u003c/label>\u003cinput id=\"ds\" type=\"range\" min=\"10\" max=\"2000\" step=\"10\" value=\"300\">\n\u003cdiv id=\"cmpo\">\u003c/div>\u003cp class=\"fb\">Kulrang — texnologiyadan oldingi vositalar, ko'k — texnologiyadan keyin.\u003c/p>\u003c/div>\n\u003cdiv class=\"fact\">💡 \u003cb>Bilasizmi?\u003c/b> Yorug'lik Quyoshdan Yergacha taxminan 8 daqiqada yetib keladi. Xalqaro kosmik stansiya Yerni taxminan 90 daqiqada aylanib chiqadi.\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Test\u003c/h3>\u003cdiv class=\"quiz\" data-s=\"1\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>3. Fan va texnologiyaning buguni va ertasi\u003c/h2>\n\u003cp class=\"th\">Bugun dronlar, robotlar va sun'iy intellekt ishlarimizni yengillashtirmoqda. Robot-changyutkich uyni o'zi tozalaydi, jarroh robot esa shifokorga aniq amaliyot qilishda yordam beradi. Sun'iy intellekt shaxmatda juda ko'p variantni bir zumda hisoblaydi. Ertaga qanday texnologiyalar paydo bo'lishi bugun o'rganayotgan bilimlarimizga bog'liq.\u003c/p>\n\u003cdiv class=\"card\">\u003ch3>Simulyatsiya: dron yetkazib berish\u003c/h3>\n\u003cdiv class=\"opt\" id=\"adr\">\u003c/div>\n\u003csvg viewBox=\"0 0 320 120\">\u003crect x=\"14\" y=\"80\" width=\"40\" height=\"30\" fill=\"var(--mut)\"/>\u003ctext class=\"lab\" x=\"14\" y=\"76\">Ombor\u003c/text>\u003cpath d=\"M262 110V86l22-18 22 18v24z\" fill=\"var(--pri)\"/>\u003ctext class=\"lab\" id=\"dtg\" x=\"262\" y=\"62\">Manzil\u003c/text>\u003cline class=\"w dash\" x1=\"60\" y1=\"60\" x2=\"260\" y2=\"60\" stroke-width=\"1.5\"/>\n\u003cg class=\"fly\" id=\"dg\">\u003crect x=\"18\" y=\"52\" width=\"14\" height=\"14\" fill=\"var(--acc)\" stroke=\"var(--ink)\" stroke-width=\"2\" transform=\"translate(12 0)\"/>\u003cellipse cx=\"45\" cy=\"34\" rx=\"13\" ry=\"6\" fill=\"var(--ink)\"/>\u003cg class=\"spin\" style=\"transform-origin:35px 28px;animation-duration:.2s\">\u003cline x1=\"22\" y1=\"28\" x2=\"48\" y2=\"28\" stroke=\"var(--pri)\" stroke-width=\"3\"/>\u003c/g>\u003cline x1=\"45\" y1=\"40\" x2=\"45\" y2=\"52\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\u003c/g>\u003c/svg>\n\u003clabel>Dron tezligi: \u003cspan id=\"dso\">50\u003c/span> km/soat\u003c/label>\u003cinput id=\"dsp\" type=\"range\" min=\"20\" max=\"90\" value=\"50\">\n\u003cdiv class=\"out\" id=\"dro\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Animatsiyalar\u003c/h3>\n\u003cdiv class=\"tabs\">\u003cbutton class=\"on\">🧹 Robot-changyutkich\u003c/button>\u003cbutton>🤖 Jarroh robot\u003c/button>\u003cbutton>♟️ Sun'iy intellekt\u003c/button>\u003c/div>\n\u003cdiv class=\"pane on\">\u003csvg viewBox=\"0 0 300 130\">\u003crect x=\"8\" y=\"8\" width=\"284\" height=\"114\" rx=\"8\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\u003crect x=\"110\" y=\"88\" width=\"60\" height=\"24\" rx=\"4\" fill=\"var(--mut)\"/>\u003cpath class=\"draw\" d=\"M25 22H275V46H25V70H275\" fill=\"none\" stroke=\"var(--ok)\" stroke-width=\"12\" opacity=\".35\"/>\u003ccircle r=\"9\" fill=\"var(--pri)\" stroke=\"var(--ink)\" stroke-width=\"2\">\u003canimateMotion dur=\"8s\" repeatCount=\"indefinite\" path=\"M25 22H275V46H25V70H275\"/>\u003c/circle>\u003c/svg>\u003c/div>\n\u003cdiv class=\"pane\">\u003csvg viewBox=\"0 0 300 130\">\u003cellipse cx=\"190\" cy=\"112\" rx=\"80\" ry=\"12\" fill=\"var(--mut)\"/>\u003crect x=\"40\" y=\"6\" width=\"40\" height=\"14\" fill=\"var(--ink)\"/>\u003cg class=\"a1\" style=\"transform-origin:60px 14px\">\u003cline x1=\"60\" y1=\"14\" x2=\"60\" y2=\"60\" stroke=\"var(--pri)\" stroke-width=\"9\" stroke-linecap=\"round\"/>\u003cg class=\"a2\" style=\"transform-origin:60px 60px\">\u003cline x1=\"60\" y1=\"60\" x2=\"60\" y2=\"100\" stroke=\"var(--pri)\" stroke-width=\"7\" stroke-linecap=\"round\"/>\u003ccircle cx=\"60\" cy=\"102\" r=\"5\" fill=\"var(--bad)\"/>\u003c/g>\u003c/g>\u003ctext class=\"lab\" x=\"130\" y=\"40\">Robot-qo'l har bir harakatni\u003c/text>\u003ctext class=\"lab\" x=\"130\" y=\"56\">millimetr aniqlikda bajaradi\u003c/text>\u003c/svg>\u003c/div>\n\u003cdiv class=\"pane\">\u003csvg viewBox=\"0 0 160 160\" style=\"max-width:300px;margin:auto\" id=\"bd\">\u003c/svg>\u003cbutton class=\"b\" id=\"ai\">Sun'iy intellekt o'ylasin (ot yurishi)\u003c/button>\u003cp class=\"out\" id=\"ct\">Tugmani bos: ot hamma mumkin yurishlarni tekshiradi.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Kelajak: 2050-yilda nima bo'ladi?\u003c/h3>\n\u003cdiv class=\"opt\" id=\"chips\">\u003c/div>\u003cdiv class=\"out\" id=\"fu\">Texnologiyalarni tanla.\u003c/div>\n\u003clabel>O'z ixtirong haqida yoz:\u003c/label>\u003ctextarea id=\"ta\" rows=\"2\" style=\"width:100%;font:inherit;border:2px solid var(--ln);border-radius:10px;padding:8px;background:var(--card);color:var(--ink)\" placeholder=\"Masalan: havoda uchadigan maktab avtobusi\">\u003c/textarea>\u003cdiv class=\"out\" id=\"tp\">\u003c/div>\u003c/div>\n\u003cdiv class=\"fact\">💡 \u003cb>Bilasizmi?\u003c/b> 1997-yilda shaxmat bo'yicha dunyo chempioni Garri Kasparov IBM'ning «Deep Blue» kompyuteriga yutqazgan.\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Test\u003c/h3>\u003cdiv class=\"quiz\" data-s=\"2\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection>\n\u003ch2>Muhim xulosalar\u003c/h2>\n\u003cdiv class=\"card conc\">\u003ch3>1. Texnologiya — fanning amaliyotda qo'llanilishi\u003c/h3>Fizika qonunni kashf etadi, texnologiya esa undan lampochka, generator, poyezd yoki MRT yaratadi.\u003c/div>\n\u003cdiv class=\"card conc\">\u003ch3>2. Noto'g'ri foydalanilsa zarar keltirishi mumkin\u003c/h3>Telefon va ekrandan haddan ortiq foydalanish ko'zni charchatadi, ba'zi qurilmalar atrof-muhitni ifloslantiradi. Texnologiyadan oqilona va xavfsiz foydalanish kerak.\u003c/div>\n\u003cdiv class=\"card conc\">\u003ch3>3. Fan va texnologiya imkoniyati cheklangan\u003c/h3>Energiya yo'qdan paydo bo'lmaydi, u faqat bir turdan boshqasiga aylanadi. Shuning uchun abadiy ishlaydigan dvigatel yaratib bo'lmaydi, har bir texnologiyaning o'z chegarasi bor.\u003c/div>\n\u003cdiv class=\"card\" style=\"text-align:center\">\u003ch3>Umumiy natija\u003c/h3>\u003cdiv class=\"big\">\u003cspan id=\"rn\">0\u003c/span>/6\u003c/div>\u003cp id=\"rm\">\u003c/p>\u003cbutton class=\"b\" onclick=\"location.reload()\">Qaytadan boshlash\u003c/button>\u003c/div>\n\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),all=s=>document.querySelectorAll(s);\nconst nav=all(\"nav button\"),secs=all(\"section\");\nfunction go(i){nav.forEach((b,k)=>b.classList.toggle(\"on\",k==i));secs.forEach((s,k)=>s.classList.toggle(\"on\",k==i));scrollTo(0,0);if(i==3)res()}\nnav.forEach((b,i)=>b.onclick=()=>go(i));nav[0].classList.add(\"on\");\nall(\".tabs\").forEach(t=>{const bx=t.parentElement,bs=t.querySelectorAll(\"button\");bs.forEach((b,i)=>b.onclick=()=>{bs.forEach((x,k)=>x.classList.toggle(\"on\",k==i));bx.querySelectorAll(\".pane\").forEach((p,k)=>p.classList.toggle(\"on\",k==i))})});\n// 1. zanjir\nlet on=1;\nfunction ck(){const v=+$(\"v\").value;$(\"vo\").textContent=v;$(\"glow\").style.opacity=on?v/12:0;$(\"sw\").style.transform=on?\"\":\"rotate(-30deg)\";$(\"io\").textContent=on?(v/6).toFixed(2):\"0\"}\n$(\"v\").oninput=ck;$(\"kal\").onclick=()=>{on^=1;ck()};ck();\nconst S=[[\"🧲\",\"Magnit\",\"Magnit va sim bir-biriga nisbatan harakatlanadi.\"],[\"⚙️\",\"Generator\",\"Turbina magnitni aylantiradi, simda tok hosil bo'ladi.\"],[\"⚡\",\"Elektr energiyasi\",\"Mexanik energiya elektr energiyasiga aylandi.\"],[\"🔌\",\"Simlar\",\"Elektr toki yuqori kuchlanishli simlar orqali uzatiladi.\"],[\"🏠\",\"Uy-jihozlari\",\"Lampa, muzlatkich va televizor ishlaydi!\"]];\nlet st=0;$(\"chain\").innerHTML=S.map(s=>`\u003cdiv class=\"node\">\u003cspan>${s[0]}\u003c/span>${s[1]}\u003c/div>`).join(\"\");\nfunction chn(){all(\".node\").forEach((n,i)=>n.classList.toggle(\"on\",i\u003c=st));$(\"cd\").textContent=`${st+1}-qadam: ${S[st][2]}`}\n$(\"nx\").onclick=()=>{st=(st+1)%5;chn()};$(\"rs\").onclick=()=>{st=0;chn()};chn();\n// 2. quyosh\nfunction sol(){const a=+$(\"ang\").value,L=+$(\"lg\").value,r=a*Math.PI/180,x=160-130*Math.cos(r),y=170-130*Math.sin(r),p=300*Math.sin(r)*L/100;\n$(\"ao\").textContent=a;$(\"lo\").textContent=L;$(\"sun\").setAttribute(\"transform\",`translate(${x} ${y})`);$(\"sun\").style.opacity=.3+.7*L/100;\nconst b=$(\"beam\");b.setAttribute(\"x1\",x);b.setAttribute(\"y1\",y);b.style.opacity=L/100;$(\"bar\").setAttribute(\"width\",p/300*280);$(\"po\").textContent=Math.round(p)}\n$(\"ang\").oninput=$(\"lg\").oninput=sol;sol();\n$(\"sp\").oninput=()=>{const s=+$(\"sp\").value;$(\"so\").textContent=s;$(\"tr\").style.animationDuration=(300/s)+\"s\"};$(\"tr\").style.animationDuration=\"3s\";\nconst M=[[\"Piyoda\",5],[\"Ot arava\",12],[\"Avtomobil\",80],[\"Poyezd\",160],[\"Samolyot\",800]];\nconst fmt=h=>h>=24?(h/24).toFixed(1)+\" kun\":h>=1?h.toFixed(1)+\" soat\":Math.max(1,Math.round(h*60))+\" daqiqa\";\nfunction cmp(){const d=+$(\"ds\").value;$(\"dv\").textContent=d;$(\"cmpo\").innerHTML=M.map((m,i)=>`\u003cdiv class=\"row ${i\u003c2?\"old\":\"\"}\">\u003cspan>${m[0]}\u003c/span>\u003ci style=\"width:${Math.max(2,m[1]>0?5/m[1]*100:0)}%\">\u003c/i>\u003cem>${fmt(d/m[1])}\u003c/em>\u003c/div>`).join(\"\")}\n$(\"ds\").oninput=cmp;cmp();\n// 3. dron\nconst A=[[\"Maktab\",2],[\"Kasalxona\",6],[\"Bozor\",9],[\"Qishloq\",15]];let ai=1;\n$(\"adr\").innerHTML=A.map((a,i)=>`\u003cbutton>${a[0]} (${a[1]} km)\u003c/button>`).join(\"\");\nconst ab=all(\"#adr button\");ab.forEach((b,i)=>b.onclick=()=>{ai=i;dr()});\nfunction dr(){const v=+$(\"dsp\").value,d=A[ai][1],t=d/v*60,c=d*1.4/25*60;$(\"dso\").textContent=v;ab.forEach((b,i)=>b.classList.toggle(\"on\",i==ai));$(\"dtg\").textContent=A[ai][0];\n$(\"dro\").innerHTML=`Dron: ${d} km ÷ ${v} km/soat = \u003cb>${t.toFixed(1)} daqiqa\u003c/b>\u003cbr>Tirband yo'lda avtomobil (25 km/soat, yo'l 1,4 marta uzun): \u003cb>${Math.round(c)} daqiqa\u003c/b>`;$(\"dg\").style.animationDuration=Math.min(8,Math.max(1.5,t/3))+\"s\"}\n$(\"dsp\").oninput=dr;dr();\n// shaxmat\n(function(){let h=\"\";for(let r=0;r\u003c8;r++)for(let c=0;c\u003c8;c++)h+=`\u003crect id=\"c${r}${c}\" x=\"${c*20}\" y=\"${r*20}\" width=\"20\" height=\"20\" class=\"${(r+c)%2?\"d\":\"l\"}\"/>`;\n$(\"bd\").innerHTML=h+`\u003ctext id=\"kn\" text-anchor=\"middle\" font-size=\"17\" fill=\"#12263f\" x=\"30\" y=\"135\">♞\u003c/text>`;\nlet pos=[6,1],busy=0;\n$(\"ai\").onclick=()=>{if(busy)return;busy=1;all(\"#bd .pick\").forEach(e=>e.classList.remove(\"pick\"));\nconst D=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],m=D.map(d=>[pos[0]+d[0],pos[1]+d[1]]).filter(p=>p[0]>=0&&p[0]\u003c8&&p[1]>=0&&p[1]\u003c8);let i=0;\n$(\"ct\").textContent=`Sun'iy intellekt ${m.length} ta variantni tekshirmoqda...`;\nconst t=setInterval(()=>{all(\"#bd .try\").forEach(e=>e.classList.remove(\"try\"));\nif(i\u003cm.length){$(\"c\"+m[i][0]+m[i][1]).classList.add(\"try\");i++}else{clearInterval(t);const p=m[Math.floor(Math.random()*m.length)];\n$(\"c\"+p[0]+p[1]).classList.add(\"pick\");$(\"kn\").setAttribute(\"x\",p[1]*20+10);$(\"kn\").setAttribute(\"y\",p[0]*20+15);pos=p;\n$(\"ct\").textContent=`Tanlangan yurish: ${\"abcdefgh\"[p[1]]}${8-p[0]}. Kompyuter o'ylamaydi — juda ko'p variantni tez hisoblaydi.`;busy=0}},400)}})();\n// kelajak\nconst F=[[\"🚗 Uchar avtomobillar\",\"magnit maydon va kuchli elektr motorlar\"],[\"🚀 Kosmik sayohat\",\"tortishish kuchi va raketa harakati\"],[\"☀️ Toza energiya\",\"yorug'lik va issiqlik energiyasi\"],[\"🤖 Uy robotlari\",\"elektr, datchiklar va sun'iy intellekt\"],[\"🪐 Marsdagi shahar\",\"bosim, harorat va kislorod haqidagi bilimlar\"],[\"🩺 Aqlli shifokor\",\"nurlar, datchiklar va kompyuter hisobi\"]];\nconst sel=new Set();$(\"chips\").innerHTML=F.map(f=>`\u003cbutton>${f[0]}\u003c/button>`).join(\"\");\nall(\"#chips button\").forEach((b,i)=>b.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle(\"on\");\n$(\"fu\").innerHTML=sel.size?`2050-yilda: ${sel.size} ta texnologiya.\u003cbr>`+[...sel].map(k=>`${F[k][0]} — fizikadan: ${F[k][1]}`).join(\"\u003cbr>\"):\"Texnologiyalarni tanla.\"});\n$(\"ta\").oninput=()=>$(\"tp\").textContent=$(\"ta\").value?`Mening 2050-yil ixtirom: ${$(\"ta\").value}`:\"\";\n// testlar\nconst Q=[[[\"Elektr zanjirida kuchlanish oshirilsa, lampochka nima bo'ladi?\",[\"Yorqinroq yonadi\",\"O'chib qoladi\",\"Hech o'zgarmaydi\"],0],[\"Generator qaysi energiyani elektr energiyasiga aylantiradi?\",[\"Tovush energiyasini\",\"Harakat (mexanik) energiyasini\",\"Hech qaysini\"],1]],\n[[\"Quyosh nurlari panelga tik tushganda energiya qanday bo'ladi?\",[\"Kamroq\",\"Hech qancha\",\"Ko'proq\"],2],[\"Sun'iy yo'ldosh nega Yer atrofida aylanadi?\",[\"Shamol itarganidan\",\"Yerning tortishish kuchi tufayli\",\"Dengiz to'lqinlari tufayli\"],1]],\n[[\"Dron 12 km masofani 60 km/soat tezlikda necha daqiqada uchadi?\",[\"6 daqiqa\",\"12 daqiqa\",\"20 daqiqa\"],1],[\"Texnologiya noto'g'ri ishlatilsa nima bo'lishi mumkin?\",[\"Zarar keltirishi mumkin\",\"Hech narsa bo'lmaydi\",\"Doim foyda beradi\"],0]]];\nconst got={};\nfunction upd(){$(\"sc\").textContent=Object.values(got).filter(Boolean).length}\nall(\".quiz\").forEach(el=>{const s=+el.dataset.s;Q[s].forEach((x,j)=>{const k=s*2+j,d=document.createElement(\"div\"),f=document.createElement(\"p\");d.className=\"qq\";f.className=\"fb\";d.innerHTML=`\u003cb>${x[0]}\u003c/b>`;\nx[1].forEach((o,n)=>{const b=document.createElement(\"button\");b.textContent=o;b.onclick=()=>{if(k in got)return;got[k]=n==x[2];b.classList.add(got[k]?\"ok\":\"bad\");\nif(!got[k])d.children[x[2]+1].classList.add(\"ok\");f.textContent=got[k]?\"To'g'ri! 🎉\":\"Noto'g'ri. To'g'ri javob yashil rangda.\";upd()};d.append(b)});d.append(f);el.append(d)})});\nfunction res(){const n=Object.values(got).filter(Boolean).length,a=Object.keys(got).length;$(\"rn\").textContent=n;\n$(\"rm\").textContent=a\u003c6?`Hali ${6-a} ta savolga javob berilmagan. Bo'limlarga qaytib, testlarni yech!`:n==6?\"Ajoyib! Siz haqiqiy yosh fizik-ixtirochisiz! 🏆\":n>=4?\"Juda yaxshi! Bir oz takrorlasangiz, hammasi a'lo bo'ladi.\":\"Yaxshi boshlanish! Simulyatsiyalarni yana o'ynab ko'ring.\"}\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"title": "Nima uchun o'lchash kerak?", "icon": "📐", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Nima uchun o'lchash kerak?\u003c/title>\n\u003cstyle>\n:root{--bg:#eef3f8;--card:#fff;--ink:#14213d;--mut:#4d5d78;--line:#c9d6e6;--acc:#ffc933;--ok:#1f9d55;--no:#d64545;--grid:rgba(20,33,61,.07);--okb:#dff5e8;--nob:#fbe1e1;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1526;--card:#16203a;--ink:#e8edf7;--mut:#a4b4d0;--line:#2c3b5c;--grid:rgba(255,255,255,.05);--okb:#12382a;--nob:#431d22}}\n:root[data-theme=dark]{--bg:#0e1526;--card:#16203a;--ink:#e8edf7;--mut:#a4b4d0;--line:#2c3b5c;--grid:rgba(255,255,255,.05);--okb:#12382a;--nob:#431d22}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:860px;margin:0 auto;padding:18px 16px 6px}\nh1{font:700 clamp(1.4rem,5vw,2.1rem)/1.15 Georgia,\"Times New Roman\",serif;margin:0}\nh2{font:700 1.5rem/1.2 Georgia,serif;margin:6px 0 10px}\nh3{font-size:1.05rem;margin:22px 0 8px}\nnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:8px 16px;max-width:860px;margin:0 auto;background:var(--bg)}\nnav button{flex:0 0 auto;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .95rem inherit;font-family:inherit;cursor:pointer}\nnav button.act{background:var(--acc);color:#14213d}\nmain{max-width:860px;margin:0 auto;padding:6px 16px 40px}\nbutton{font-family:inherit}\nbutton:focus-visible,input:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}\n.goal{background:var(--acc);color:#14213d;border-radius:10px;padding:10px 14px;font-weight:600}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0}\n.fact{border-left:6px solid var(--acc);background:var(--card);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}\n.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}\n.btn,.btns button,.game button,.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 13px;font-size:.95rem;cursor:pointer}\n.btn.p,.btns button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}\nbutton:disabled{opacity:.7;cursor:default}\nsvg{width:100%;height:auto;display:block}\nsvg text{fill:var(--ink);font:11px system-ui}\nsvg .lb{font-weight:700;font-size:12px}\n.sA{fill:#ffc933;stroke:#14213d}.sB{fill:#7cc4f2;stroke:#14213d}\ninput[type=range]{width:100%;accent-color:#e5a800}\ninput[type=text]{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px;font-size:1rem;width:150px}\n.msg{min-height:1.6em;margin:6px 0;font-weight:600}\n.ok,.msg.ok{color:var(--ok)}.no,.msg.no{color:var(--no)}\n.opt.ok,.game button.ok{background:var(--okb);border-color:var(--ok);color:var(--ink)}\n.opt.no,.game button.no{background:var(--nob);border-color:var(--no);color:var(--ink)}\n.opt{display:block;width:100%;text-align:left;margin:6px 0}\n.ex{background:var(--bg);border-radius:8px;padding:8px 10px;margin:4px 0 14px}\n.game{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}\n.game div{display:flex;flex-direction:column;gap:8px}\n.game button.sel{border-color:#e5a800;background:#fff3c4;color:#14213d}\n.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0}\n.row i{font-style:normal;color:var(--mut)}\n.row b,.rules li{padding:6px 12px;border:2px solid var(--line);border-radius:10px;font-weight:600;transition:.4s}\n.row b.on,.rules li.on{background:var(--acc);color:#14213d;border-color:var(--ink);transform:scale(1.05)}\n.rules{padding-left:0;list-style:none;display:grid;gap:8px}\n.rules li{counter-increment:r}\n.rules li:before{content:counter(r) \". \"}\n.flex{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}\n.flex>*{flex:1 1 260px}\ntable{width:100%;border-collapse:collapse;font-size:.92rem}\nth,td{border:1px solid var(--line);padding:6px 8px;text-align:left}\nth{background:var(--bg)}\n.okc{color:var(--ok);font-weight:700}.noc{color:var(--no);font-weight:700}\n#mer{transform-origin:100px 220px;transition:transform .6s ease}\n#ck,#ch{transition:transform .8s ease}\n#ck{transform-origin:130px 130px}\n.badge{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:700;background:var(--acc);color:#14213d}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>Nima uchun o'lchash kerak?\u003c/h1>\u003cbutton class=\"btn\" id=\"th\" aria-label=\"Qorong'i / yorug' rejim\">🌓\u003c/button>\u003c/header>\n\u003cnav aria-label=\"Bo'limlar\">\n\u003cbutton class=\"act\" data-t=\"0\">1. Bilim\u003c/button>\u003cbutton data-t=\"1\">2. Ko'nikma\u003c/button>\u003cbutton data-t=\"2\">3. Qo'llash\u003c/button>\u003cbutton data-t=\"3\">Xulosa\u003c/button>\n\u003c/nav>\n\u003cmain>\n\n\u003csection id=\"s0\">\n\u003ch2>Bilim: o'lchash nima?\u003c/h2>\n\u003cp class=\"goal\">Maqsad: o'lchash, fizik kattalik va o'lchov birligi nima ekanini bilib olasan.\u003c/p>\n\u003cp>O'lchash — biror kattalikni o'lchov birligi bilan solishtirishdir. Uzunlik, massa, vaqt va harorat fizik kattaliklar deyiladi. Ularning birliklari: metr (m), kilogramm (kg), sekund (s) va gradus Selsiy (°C). Natija har doim son va birlik bilan yoziladi, masalan: 15 sm.\u003c/p>\n\n\u003ch3>Simulyatsiya: qarich bilan o'lcha\u003c/h3>\n\u003cdiv class=\"card\">\n\u003cp style=\"margin:0 0 6px\">Ali va Vali bir xil partani o'lchaydi. Birlikni tanla:\u003c/p>\n\u003cdiv class=\"btns\" id=\"ub\">\u003cbutton data-u=\"qarich\" class=\"on\">Qarich\u003c/button>\u003cbutton data-u=\"qadam\">Qadam\u003c/button>\u003cbutton data-u=\"santimetr\">Santimetr\u003c/button>\u003c/div>\n\u003csvg viewBox=\"0 0 480 110\" id=\"desk\" role=\"img\" aria-label=\"Parta o'lchash\">\u003c/svg>\n\u003cp class=\"msg\" id=\"dm\">\u003c/p>\n\u003c/div>\n\n\u003ch3>Animatsiya: kattalik → asbob → birlik\u003c/h3>\n\u003cdiv class=\"card\" id=\"c1\">\n\u003cdiv class=\"row\">\u003cb>Uzunlik\u003c/b>\u003ci>→\u003c/i>\u003cb>Chizg'ich\u003c/b>\u003ci>→\u003c/i>\u003cb>sm\u003c/b>\u003c/div>\n\u003cdiv class=\"row\">\u003cb>Massa\u003c/b>\u003ci>→\u003c/i>\u003cb>Tarozi\u003c/b>\u003ci>→\u003c/i>\u003cb>kg\u003c/b>\u003c/div>\n\u003cdiv class=\"row\">\u003cb>Vaqt\u003c/b>\u003ci>→\u003c/i>\u003cb>Soat\u003c/b>\u003ci>→\u003c/i>\u003cb>s\u003c/b>\u003c/div>\n\u003cdiv class=\"row\">\u003cb>Harorat\u003c/b>\u003ci>→\u003c/i>\u003cb>Termometr\u003c/b>\u003ci>→\u003c/i>\u003cb>°C\u003c/b>\u003c/div>\n\u003cbutton class=\"btn p\" onclick=\"seq('c1',this)\">▶ Boshlash\u003c/button>\n\u003c/div>\n\n\u003ch3>Mini-o'yin: kattalik va birligini juftla\u003c/h3>\n\u003cdiv class=\"card\">\u003cp style=\"margin:0 0 8px\">Avval chapdan kattalikni, keyin o'ngdan uning birligini bos.\u003c/p>\n\u003cdiv class=\"game\" id=\"game\">\u003cdiv id=\"gl\">\u003c/div>\u003cdiv id=\"gr\">\u003c/div>\u003c/div>\u003cp class=\"msg\" id=\"gm\">\u003c/p>\u003c/div>\n\n\u003cdiv class=\"fact\">\u003cb>Bilasizmi?\u003c/b> Qadimda uzunlik birligi sifatida tirsak, qadam va qarich ishlatilgan. Hozir 1 metr yorug'lik vakuumda sekundning 299 792 458 dan bir ulushida bosib o'tadigan masofa sifatida belgilangan.\u003c/div>\n\u003ch3>Test\u003c/h3>\u003cdiv id=\"q0\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s1\" hidden>\n\u003ch2>Ko'nikma: chizg'ich va termometr\u003c/h2>\n\u003cp class=\"goal\">Maqsad: asbob bilan to'g'ri o'lchaysan va natijani birligi bilan yozasan.\u003c/p>\n\u003cp>Avval bo'lim bahosini aniqla: shkalaning ikki yaqin chizig'i orasidagi qiymat. Chizg'ichda uni noldan boshlab qo'y. Shkalaga to'g'ri tepadan qara, ko'zing qiyshiq bo'lmasin. Natijani son va birlik bilan yoz: 7,4 sm yoki 36 °C.\u003c/p>\n\n\u003ch3>A. Chizg'ich\u003c/h3>\n\u003cdiv class=\"card\">\n\u003csvg viewBox=\"0 0 640 150\" role=\"img\" aria-label=\"Chizg'ich va qalam\">\u003crect x=\"14\" y=\"76\" width=\"616\" height=\"70\" rx=\"6\" fill=\"#ffe08a\" stroke=\"#14213d\"/>\u003cg id=\"rt\" stroke=\"#14213d\">\u003c/g>\u003ctext x=\"600\" y=\"138\" class=\"lb\" style=\"fill:#14213d\">sm\u003c/text>\u003cg id=\"pn\">\u003c/g>\u003c/svg>\n\u003cp class=\"msg\" id=\"rs\">\u003c/p>\n\u003clabel>Qalamni surish: \u003cinput type=\"range\" id=\"ro\" min=\"0\" max=\"3\" step=\"0.1\" value=\"1.5\">\u003c/label>\n\u003cp style=\"margin:4px 0\">\u003cb>Bo'lim bahosi: 1 mm = 0,1 sm\u003c/b>\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>Qalam uzunligi: \u003cinput type=\"text\" id=\"ri\" placeholder=\"masalan, 7,4 sm\">\u003c/label>\u003cbutton class=\"btn p\" id=\"rc\">Tekshirish\u003c/button>\u003cbutton class=\"btn\" id=\"rn\">Yangi qalam\u003c/button>\u003c/div>\n\u003cp class=\"msg\" id=\"rm\">\u003c/p>\n\u003c/div>\n\n\u003ch3>B. Termometr\u003c/h3>\n\u003cdiv class=\"card flex\">\n\u003csvg viewBox=\"0 0 200 270\" style=\"max-width:220px\" role=\"img\" aria-label=\"Termometr\">\u003crect x=\"88\" y=\"14\" width=\"24\" height=\"212\" rx=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"color:var(--ink)\"/>\u003cg id=\"tk\" stroke=\"#888\">\u003c/g>\u003crect id=\"mer\" x=\"96\" y=\"20\" width=\"8\" height=\"200\" fill=\"#e53935\"/>\u003ccircle cx=\"100\" cy=\"240\" r=\"20\" fill=\"#e53935\" stroke=\"#14213d\" stroke-width=\"2\"/>\u003c/svg>\n\u003cdiv>\n\u003cp style=\"font-size:1.6rem;font-weight:700;margin:0\" id=\"tv\">36 °C\u003c/p>\n\u003cp class=\"msg\" style=\"margin:0\">\u003cspan class=\"badge\" id=\"ts\">Suv\u003c/span>\u003c/p>\n\u003clabel>Suv harorati\u003cinput type=\"range\" id=\"tr\" min=\"0\" max=\"100\" step=\"1\" value=\"36\">\u003c/label>\n\u003cp style=\"margin:4px 0\">\u003cb>Bo'lim bahosi: 2 °C\u003c/b>\u003c/p>\n\u003cdiv class=\"btns\">\u003cbutton id=\"tq\" class=\"btn\">🎲 Tasodifiy harorat\u003c/button>\u003cbutton id=\"tf\" class=\"btn\">Erkin kuzatish\u003c/button>\u003c/div>\n\u003cdiv class=\"row\" id=\"tb2\" hidden>\u003cinput type=\"text\" id=\"ti\" placeholder=\"masalan, 46 °C\">\u003cbutton class=\"btn p\" id=\"tc\">Tekshirish\u003c/button>\u003c/div>\n\u003cp class=\"msg\" id=\"tm\">\u003c/p>\n\u003c/div>\u003c/div>\n\n\u003ch3>Animatsiya: o'lchash qoidalari\u003c/h3>\n\u003cdiv class=\"card\">\u003col class=\"rules\" id=\"rl\">\u003cli>Asbobni tanla\u003c/li>\u003cli>Bo'lim bahosini aniqla\u003c/li>\u003cli>Noldan boshlab qo'y\u003c/li>\u003cli>Shkalaga to'g'ri qarab o'qi\u003c/li>\u003cli>Natijani birligi bilan yoz\u003c/li>\u003c/ol>\n\u003cbutton class=\"btn p\" onclick=\"seq('rl',this,900)\">▶ Boshlash\u003c/button>\u003c/div>\n\n\u003ch3>Jadval: mening o'lchashlarim\u003c/h3>\n\u003cdiv class=\"card\" style=\"overflow-x:auto\">\u003ctable>\u003cthead>\u003ctr>\u003cth>№\u003c/th>\u003cth>Asbob\u003c/th>\u003cth>To'g'ri javob\u003c/th>\u003cth>Mening javobim\u003c/th>\u003cth>Natija\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"tb\">\u003c/tbody>\u003c/table>\u003cp class=\"msg\" style=\"font-weight:400;color:var(--mut)\">Har bir tekshirishdan keyin shu yerga yangi qator qo'shiladi.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"fact\">\u003cb>Bilasizmi?\u003c/b> Selsiy shkalasi suvning muzlash (0 °C) va qaynash (100 °C) haroratlariga asoslangan. Anders Selsiy 1742-yilda uni teskari qilib, qaynashni 0 ga, muzlashni 100 ga qo'ygan.\u003c/div>\n\u003ch3>Test\u003c/h3>\u003cdiv id=\"q1\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s2\" hidden>\n\u003ch2>Qo'llash: nega o'lchash kerak?\u003c/h2>\n\u003cp class=\"goal\">Maqsad: hayotda o'lchash nima uchun kerakligini misollar bilan tushuntirasan.\u003c/p>\n\u003cp>O'lchash natijani aniq va hamma uchun bir xil qiladi. Chamalash esa odamdan odamga farq qiladi. Aniq o'lchov taom, bino, dori va sport natijalarini to'g'ri qilishga yordam beradi. Fan ham o'lchashlarga tayanadi: son bor joyda solishtirish va tekshirish mumkin.\u003c/p>\n\n\u003ch3>Simulyatsiya: tort pishiramiz\u003c/h3>\n\u003cdiv class=\"card flex\">\n\u003csvg viewBox=\"0 0 260 150\" role=\"img\" aria-label=\"Tort\">\u003cellipse cx=\"130\" cy=\"132\" rx=\"115\" ry=\"12\" fill=\"#cfd8e6\"/>\u003crect id=\"ck\" x=\"60\" y=\"30\" width=\"140\" height=\"100\" rx=\"14\" fill=\"#d99a4e\" style=\"transform:scaleY(.1)\"/>\u003ccircle id=\"ch\" cx=\"130\" cy=\"130\" r=\"9\" fill=\"#d64545\" style=\"opacity:0\"/>\u003c/svg>\n\u003cdiv>\n\u003cp style=\"margin:0\">\u003cb>Retsept: 250 g un\u003c/b>\u003c/p>\n\u003cdiv class=\"btns\" id=\"mb\">\u003cbutton data-m=\"cham\" class=\"on\">Ko'z bilan chamalash\u003c/button>\u003cbutton data-m=\"tar\">Tarozi bilan\u003c/button>\u003c/div>\n\u003clabel>Un miqdori: \u003cb id=\"fv\">250 g\u003c/b>\u003cinput type=\"range\" id=\"fl\" min=\"0\" max=\"500\" step=\"10\" value=\"250\">\u003c/label>\n\u003cbutton class=\"btn p\" id=\"bake\">🍰 Pishirish\u003c/button>\n\u003cp class=\"msg\" id=\"bm\">\u003c/p>\n\u003c/div>\u003c/div>\n\n\u003ch3>Animatsiya: kim nimani o'lchaydi?\u003c/h3>\n\u003cdiv class=\"card\" id=\"c3\">\n\u003cdiv class=\"row\">\u003cb>Shifokor\u003c/b>\u003ci>→\u003c/i>\u003cb>tana harorati\u003c/b>\u003ci>→\u003c/i>\u003cb>°C\u003c/b>\u003c/div>\n\u003cdiv class=\"row\">\u003cb>Quruvchi\u003c/b>\u003ci>→\u003c/i>\u003cb>devor uzunligi\u003c/b>\u003ci>→\u003c/i>\u003cb>m\u003c/b>\u003c/div>\n\u003cdiv class=\"row\">\u003cb>Oshpaz\u003c/b>\u003ci>→\u003c/i>\u003cb>un massasi\u003c/b>\u003ci>→\u003c/i>\u003cb>g\u003c/b>\u003c/div>\n\u003cdiv class=\"row\">\u003cb>Sportchi\u003c/b>\u003ci>→\u003c/i>\u003cb>yugurish vaqti\u003c/b>\u003ci>→\u003c/i>\u003cb>s\u003c/b>\u003c/div>\n\u003cbutton class=\"btn p\" onclick=\"seq('c3',this)\">▶ Boshlash\u003c/button>\u003c/div>\n\n\u003cdiv class=\"fact\">\u003cb>Bilasizmi?\u003c/b> 1999-yilda NASAning Mars Climate Orbiter kosmik apparati yo'qolgan. Sabab: bir jamoa nyuton, boshqasi funt-kuch birligida hisoblagan. Birliklar aralashib ketsa, katta xato chiqadi.\u003c/div>\n\u003ch3>Test\u003c/h3>\u003cdiv id=\"q2\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s3\" hidden>\n\u003ch2>Xulosa\u003c/h2>\n\u003cp class=\"goal\">O'lchash — kattalikni o'lchov birligi bilan solishtirish.\u003c/p>\n\u003cdiv class=\"card\">\u003cul style=\"margin:0;padding-left:20px\">\n\u003cli>Fizik kattaliklar: uzunlik, massa, vaqt, harorat. Birliklari: m, kg, s, °C.\u003c/li>\n\u003cli>Qarich va qadam har kimda har xil, shuning uchun hamma uchun bir xil birlik kerak.\u003c/li>\n\u003cli>To'g'ri o'lchash: asbobni tanla, bo'lim bahosini aniqla, noldan boshla, to'g'ri qarab o'qi, birligi bilan yoz.\u003c/li>\n\u003cli>Chamalash xato berishi mumkin, asbob esa aniq va takrorlanuvchan natija beradi.\u003c/li>\n\u003c/ul>\u003c/div>\n\u003cp style=\"font-size:1.2rem\">Test natijang: \u003cb id=\"score\">0\u003c/b> / 6\u003c/p>\n\u003cbutton class=\"btn p\" onclick=\"location.reload()\">Boshidan boshlash\u003c/button>\n\u003c/section>\n\u003c/main>\n\n\u003cscript>\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst f=(n,d=1)=>(+n.toFi da oʻlchaydi.'},\n{q:'Tezlik qanday kattalik?',o:['Asosiy','Hosilaviy','Kattalik emas'],a:1,e:'Tezlik = masofa : vaqt, ya’ni asosiy kattaliklardan hosil qilingan.'},\n{q:'Shkala boʻlinmasi qiymati qanday topiladi?',o:['Qoʻshni ikki raqam yigʻindisi','Raqamlar orasidagi farqni boʻlinmalar soniga boʻlish','Eng katta raqamni 2 ga boʻlish'],a:1,e:'Masalan, 0 va 10 orasida 5 boʻlinma bor: (10 − 0) : 5 = 2.'}],sc);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Uzunlikni qanday o'lchaymiz", "icon": "📏", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Uzunliklarni qanday oʻlchaymiz\u003c/title>\n\u003cstyle>\n/* Ranglar (yorugʻ va qorongʻi rejim) */\n:root{--bg:#fff7e6;--card:#fff;--ink:#2b2d42;--a:#ff7f50;--b:#2ec4b6;--c:#5b8def;--y:#ffc233;--ok:#2fb344;--bad:#e8590c;--line:#e9dcc3;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#1e2233;--card:#2a2f45;--ink:#f4f4f8;--line:#3d4466}}\n:root[data-theme=\"dark\"]{--bg:#1e2233;--card:#2a2f45;--ink:#f4f4f8;--line:#3d4466}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font:20px/1.4 system-ui,\"Segoe UI\",Arial,sans-serif}\nheader{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 12px}\nh1{font-size:1.2em;margin:0 0 6px;text-align:center}\n.prog{height:14px;background:var(--line);border-radius:9px;overflow:hidden}\n.prog i{display:block;height:100%;width:33%;background:linear-gradient(90deg,var(--a),var(--y));border-radius:9px;transition:width .5s}\n.tabs{display:flex;gap:6px;margin-top:8px}\n.tabs button{flex:1}\nmain{max-width:900px;margin:0 auto;padding:8px 12px 90px}\nsection{display:none;animation:in .5s}\nsection.on{display:block}\n@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n.card{background:var(--card);border-radius:22px;padding:14px;margin:12px 0;box-shadow:0 3px 0 var(--line)}\nh2{font-size:1.3em;margin:4px 0 8px;color:var(--a)}\nh3{font-size:1.1em;margin:0 0 6px}\nbutton{font:inherit;font-weight:700;border:0;border-radius:30px;padding:10px 18px;background:var(--c);color:#fff;cursor:pointer;transition:transform .15s}\nbutton:active{transform:scale(.94)}\nbutton.alt{background:var(--b)} button.warm{background:var(--a)}\n.tabs button{background:var(--line);color:var(--ink);padding:8px 4px;font-size:.8em}\n.tabs button.on{background:var(--a);color:#fff}\n.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;background:var(--bg);z-index:5}\n.nav button:disabled{opacity:.35}\ninput[type=range]{width:100%;accent-color:var(--a);height:30px}\ninput[type=number],select{font:inherit;padding:8px 12px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);width:130px}\n.track{position:relative;height:42px;background:var(--line);border-radius:12px;overflow:hidden;margin:6px 0}\n.seg{position:absolute;inset:0}\n.cover{position:absolute;inset:0;background:var(--line);transform-origin:right}\n.res{font-weight:800;font-size:1.15em}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.units{display:flex;flex-wrap:wrap;gap:8px}\n.info{min-height:3em;margin-top:8px;font-weight:600}\n.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}\n.tool{background:var(--bg);border:3px dashed var(--line);border-radius:20px;padding:8px;text-align:center;cursor:pointer;transition:.2s}\n.tool.hit{border-color:var(--ok);background:rgba(47,179,68,.15)}\n.tool svg{width:100%;height:60px}\n.items{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}\n.item{touch-action:none;user-select:none;background:var(--y);color:#2b2d42;font-weight:800;border-radius:30px;padding:10px 16px;cursor:grab}\n.item.sel{outline:4px solid var(--c)}\n.msg{font-weight:700;min-height:2.6em;margin-top:6px}\n.good{color:var(--ok)} .soft{color:var(--bad)}\n.rl{position:relative;height:96px;background:var(--bg);border:3px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}\n.rl .t{position:absolute;bottom:0;width:2px;background:var(--ink);height:22px}\n.rl .n{position:absolute;bottom:24px;font-size:.7em;transform:translateX(-50%)}\n.rl .obj{position:absolute;top:8px;left:0;height:30px;background:var(--a);border-radius:0 10px 10px 0;transition:width .6s}\n/* oʻlchov animatsiyalari */\n.lane{position:relative;height:44px;margin:8px 0;background:var(--bg);border-radius:12px;overflow:hidden}\n.lane b{position:absolute;left:0;top:4px;height:14px;width:55%;background:#8d99ae;border-radius:0 8px 8px 0}\n.lane .m{position:absolute;left:0;top:22px;height:16px;border-radius:0 8px 8px 0}\n.lane small{position:absolute;right:8px;top:10px;font-weight:700}\n.m1{width:55%;background:repeating-linear-gradient(90deg,var(--y) 0 9px,#fff 9px 10px);animation:slide 3s ease-in-out infinite alternate}\n.m2{background:var(--b);animation:grow 3s ease-in-out infinite alternate}\n.m3{background:var(--a);border-right:8px solid #333;animation:grow2 3s ease-in-out infinite alternate}\n@keyframes slide{from{transform:translateX(-25%)}to{transform:none}}\n@keyframes grow{from{width:0}to{width:55%}}\n@keyframes grow2{from{width:8%}to{width:55%}}\n/* birliklar yigʻilishi */\n.join{display:flex;gap:12px;margin:6px 0;transition:gap .8s}\n.join span{flex:1;height:34px;background:var(--c);border-radius:8px;transition:border-radius .8s,background .8s}\n.join.go{gap:0}.join.go span{border-radius:0;background:var(--a)}\n.conv div{display:flex;justify-content:space-between;padding:6px 12px;margin:4px 0;background:var(--bg);border-radius:14px;font-weight:700}\n.stars{font-size:1.5em;letter-spacing:3px}\n@media(min-width:900px){body{font-size:24px}.tools{grid-template-columns:repeat(4,1fr)}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003ch1>📏 Uzunliklarni qanday oʻlchaymiz\u003c/h1>\n  \u003cdiv class=\"prog\">\u003ci id=\"bar\">\u003c/i>\u003c/div>\n  \u003cdiv class=\"tabs\" id=\"tabs\">\u003c/div>\n\u003c/header>\n\u003cmain>\n\n\u003c!-- 1-BOʻLIM -->\n\u003csection id=\"s0\" class=\"on\">\n  \u003cdiv class=\"card\">\n    \u003ch2>Nega yagona birlik kerak?\u003c/h2>\n    \u003cp>Ikki bola bir xil partani oʻlchadi. Natijalari nega boshqa-boshqa?\u003c/p>\n    \u003ch3>🖐️ Ali — qarich bilan\u003c/h3>\n    \u003cdiv class=\"track\">\u003cdiv class=\"seg\" id=\"sg1\">\u003c/div>\u003cdiv class=\"cover\" id=\"cv1\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"res\" id=\"r1\">\u003c/div>\n    \u003clabel>Qarich uzunligi: \u003cb id=\"v1\">\u003c/b> sm\u003c/label>\n    \u003cinput type=\"range\" id=\"u1\" min=\"12\" max=\"24\" value=\"20\">\n    \u003ch3>👣 Vali — qadam bilan\u003c/h3>\n    \u003cdiv class=\"track\">\u003cdiv class=\"seg\" id=\"sg2\">\u003c/div>\u003cdiv class=\"cover\" id=\"cv2\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"res\" id=\"r2\">\u003c/div>\n    \u003clabel>Qadam uzunligi: \u003cb id=\"v2\">\u003c/b> sm\u003c/label>\n    \u003cinput type=\"range\" id=\"u2\" min=\"20\" max=\"60\" value=\"28\">\n    \u003cdiv class=\"row\">\n      \u003cbutton class=\"warm\" id=\"go1\">▶ Oʻlchash\u003c/button>\n      \u003cbutton class=\"alt\" id=\"one\">✅ Yagona birlik (sm)\u003c/button>\n      \u003cbutton id=\"rst1\">↺ Qaytarish\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"msg\" id=\"m1\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\">\n    \u003ch2>Uzunlik birliklari\u003c/h2>\n    \u003cdiv class=\"units\" id=\"units\">\u003c/div>\n    \u003cdiv class=\"info\" id=\"uinfo\">Birlikni bos 👆\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 2-BOʻLIM -->\n\u003csection id=\"s1\">\n  \u003cdiv class=\"card\">\n    \u003ch2>Oʻlchov asboblari\u003c/h2>\n    \u003cdiv class=\"lane\">\u003cb>\u003c/b>\u003cdiv class=\"m m1\">\u003c/div>\u003csmall>Chizgʻich\u003c/small>\u003c/div>\n    \u003cdiv class=\"lane\">\u003cb>\u003c/b>\u003cdiv class=\"m m2\">\u003c/div>\u003csmall>Lenta\u003c/small>\u003c/div>\n    \u003cdiv class=\"lane\">\u003cb>\u003c/b>\u003cdiv class=\"m m3\">\u003c/div>\u003csmall>Ruletka\u003c/small>\u003c/div>\n    \u003cp>Asbobni bos — nomi va ishlatilishi chiqadi.\u003c/p>\n    \u003cdiv class=\"tools\" id=\"tools\">\u003c/div>\n    \u003cdiv class=\"info\" id=\"tinfo\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\">\n    \u003ch2>Qaysi asbob mos?\u003c/h2>\n    \u003cp>Buyumni asbobga surib qoʻy (yoki buyumni, keyin asbobni bos).\u003c/p>\n    \u003cdiv class=\"items\" id=\"items\">\u003c/div>\n    \u003cdiv class=\"msg\" id=\"gm\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\">\n    \u003ch2>Virtual chizgʻich\u003c/h2>\n    \u003cp>Qizil boʻlak 0 dan boshlanadi. Uzunligi necha sm?\u003c/p>\n    \u003cdiv class=\"rl\" id=\"rl\">\u003c/div>\n    \u003cdiv class=\"row\">\n      \u003cinput type=\"number\" id=\"ans\" inputmode=\"numeric\" placeholder=\"? sm\">\n      \u003cbutton class=\"alt\" id=\"chk\">Tekshirish\u003c/button>\n      \u003cbutton id=\"nx\">Yangi 🔄\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"msg\" id=\"rm\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 3-BOʻLIM -->\n\u003csection id=\"s2\">\n  \u003cdiv class=\"card\">\n    \u003ch2>Birliklar bogʻliqligi\u003c/h2>\n    \u003cp>Bos — boʻlakchalar yigʻilib katta birlikka aylanadi.\u003c/p>\n    \u003cdiv id=\"joins\">\u003c/div>\n    \u003cbutton class=\"warm\" id=\"jb\">🧲 Yigʻish\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"card\">\n    \u003ch2>Oʻzgartirgich\u003c/h2>\n    \u003cdiv class=\"row\">\n      \u003cinput type=\"number\" id=\"cn\" value=\"3\" min=\"0\" step=\"any\" inputmode=\"decimal\">\n      \u003cselect id=\"cu\">\u003coption value=\"0\">mm\u003c/option>\u003coption value=\"1\">sm\u003c/option>\u003coption value=\"2\">dm\u003c/option>\u003coption value=\"3\" selected>m\u003c/option>\u003coption value=\"4\">km\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"conv\" id=\"cv\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\">\n    \u003ch2>Mini-test\u003c/h2>\n    \u003cdiv class=\"stars\" id=\"st\">\u003c/div>\n    \u003cdiv id=\"qz\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\u003c/main>\n\u003cdiv class=\"nav\">\u003cbutton id=\"pv\">◀ Oldingi\u003c/button>\u003cbutton class=\"warm\" id=\"nxt\">Keyingi ▶\u003c/button>\u003c/div>\n\n\u003cscript>\nconst $=id=>document.getElementById(id);\n/* ===== Boʻlimlar oʻrtasida oʻtish ===== */\nconst names=[\"1. Birlik\",\"2. Asboblar\",\"3. Bogʻliqlik\"];\nlet cur=0;\nnames.forEach((n,i)=>{const b=document.createElement(\"button\");b.textContent=n;b.onclick=()=>show(i);$(\"tabs\").appendChild(b)});\nfunction show(i){\n  cur=i;\n  document.querySelectorAll(\"section\").forEach((s,k)=>s.classList.toggle(\"on\",k===i));\n  [...$(\"tabs\").children].forEach((b,k)=>b.classList.toggle(\"on\",k===i));\n  $(\"bar\").style.width=((i+1)/3*100)+\"%\";\n  $(\"pv\").disabled=i===0; $(\"nxt\").disabled=i===2;\n  scrollTo({top:0,behavior:\"smooth\"});\n}\n$(\"pv\").onclick=()=>show(cur-1); $(\"nxt\").onclick=()=>show(cur+1);\n\n/* ===== 1-boʻlim: qarich va qadam ===== */\nconst DESK=140; // parta uzunligi (sm)\nlet unified=false;\nfunction segStyle(el,u){\n  const w=Math.max(u/DESK*100,.9);\n  el.style.background=\"linear-gradient(90deg,transparent calc(100% - 2px),var(--ink) 0)\";\n  el.style.backgroundSize=w+\"% 100%\";\n}\nfunction upd1(){\n  const a=unified?1:+$(\"u1\").value, b=unified?1:+$(\"u2\").value;\n  $(\"v1\").textContent=$(\"u1\").value; $(\"v2\").textContent=$(\"u2\").value;\n  segStyle($(\"sg1\"),a); segStyle($(\"sg2\"),b);\n  const u=unified?\" sm\":\"\"; \n  $(\"r1\").textContent=\"Natija: \"+Math.round(DESK/a)+(unified?\" sm\":\" qarich\");\n  $(\"r2\").textContent=\"Natija: \"+Math.round(DESK/b)+(unified?\" sm\":\" qadam\");\n  $(\"u1\").disabled=$(\"u2\").disabled=unified;\n  $(\"m1\").innerHTML=unified?'\u003cspan class=\"good\">Endi ikkalasining natijasi bir xil! Hamma sm bilan oʻlchaydi 🎉\u003c/span>':'\u003cspan class=\"soft\">Natijalar har xil: birliklar har kimda har xil.\u003c/span>';\n}\nfunction play1(){\n  [\"cv1\",\"cv2\"].forEach(id=>{$(id).animate([{transform:\"scaleX(1)\"},{transform:\"scaleX(0)\"}],{duration:1800,easing:\"ease-out\",fill:\"forwards\"})});\n}\n$(\"u1\").oninput=$(\"u2\").oninput=upd1;\n$(\"go1\").onclick=()=>{[\"cv1\",\"cv2\"].forEach(id=>$(id).getAnimations().forEach(a=>a.cancel()));play1()};\n$(\"one\").onclick=()=>{unified=true;upd1();$(\"go1\").click()};\n$(\"rst1\").onclick=()=>{unified=false;upd1();$(\"go1\").click()};\nupd1();play1();\n\n/* birlik kartochkalari */\nconst U=[[\"mm\",\"Qalam uchining qalinligi ✏️\"],[\"sm\",\"Oʻchirgʻichning uzunligi 🧽\"],[\"dm\",\"Daftarning eni 📒\"],[\"m\",\"Eshikning balandligi 🚪\"],[\"km\",\"Maktabdan bogʻgacha boʻlgan masofa 🌳\"]];\nU.forEach(([n,t],i)=>{const b=document.createElement(\"button\");b.textContent=n;b.className=[\"warm\",\"alt\",\"\",\"warm\",\"alt\"][i];\n  b.onclick=()=>{$(\"uinfo\").innerHTML=\"\u003cb>1 \"+n+\"\u003c/b> — \"+t};$(\"units\").appendChild(b)});\n\n/* ===== 2-boʻlim: asboblar ===== */\nconst T={\n ruler:[\"Chizgʻich\",\"Daftarda chiziq chizish va kichik buyumlarni oʻlchash uchun.\",'\u003crect x=\"5\" y=\"20\" width=\"110\" height=\"24\" rx=\"4\" fill=\"#ffc233\"/>\u003cpath d=\"M15 20v10M30 20v6M45 20v10M60 20v6M75 20v10M90 20v6M105 20v10\" stroke=\"#333\" stroke-width=\"2\"/>'],\n tape:[\"Oʻlchov lentasi\",\"Yumshoq lenta: uzun masofa, masalan yoʻl yoki hovli uzunligini oʻlchaydi.\",'\u003ccircle cx=\"30\" cy=\"32\" r=\"22\" fill=\"#2ec4b6\"/>\u003ccircle cx=\"30\" cy=\"32\" r=\"8\" fill=\"#fff\"/>\u003crect x=\"45\" y=\"28\" width=\"70\" height=\"9\" fill=\"#2ec4b6\"/>'],\n meter:[\"Metr\",\"Yogʻoch metr: parta, doska kabi oʻrtacha buyumlar uzunligi uchun.\",'\u003crect x=\"5\" y=\"22\" width=\"110\" height=\"18\" rx=\"3\" fill=\"#5b8def\"/>\u003cpath d=\"M5 31h110\" stroke=\"#fff\" stroke-dasharray=\"3 12\" stroke-width=\"3\"/>'],\n roulette:[\"Ruletka\",\"Metall lenta qutiga oʻraladi: xona, devor, eshik oʻlchamlarini oʻlchaydi.\",'\u003crect x=\"8\" y=\"14\" width=\"42\" height=\"38\" rx=\"9\" fill=\"#ff7f50\"/>\u003crect x=\"50\" y=\"30\" width=\"62\" height=\"8\" fill=\"#ffc233\"/>\u003ccircle cx=\"29\" cy=\"33\" r=\"7\" fill=\"#fff\"/>']\n};\nObject.entries(T).forEach(([k,[n,,svg]])=>{\n  const d=document.createElement(\"div\");d.className=\"tool\";d.dataset.k=k;\n  d.innerHTML='\u003csvg viewBox=\"0 0 120 64\">'+svg+'\u003c/svg>\u003cb>'+n+'\u003c/b>\u003cdiv class=\"pl\">\u003c/div>';\n  d.onclick=()=>{ if(sel){place(sel,k)} else $(\"tinfo\").innerHTML=\"\u003cb>\"+n+\":\u003c/b> \"+T[k][1] };\n  $(\"tools\").appendChild(d);\n});\n/* oʻyin: buyum -> toʻgʻri asbob va maslahat */\nconst I=[[\"✏️ Qalam\",\"ruler\",\"Qalam kichkina — kichik buyumga qisqa asbob mos.\"],\n         [\"🪑 Parta\",\"meter\",\"Parta oʻrtacha uzunlikda. Juda uzun ham, juda qisqa ham emas.\"],\n         [\"🏫 Sinf xonasi\",\"roulette\",\"Xona katta, ammo yopiq — uni qutiga oʻraladigan lenta bilan oʻlchash qulay.\"],\n         [\"🛣️ Yoʻl\",\"tape\",\"Yoʻl juda uzun! Uzun, choʻziladigan lenta kerak.\"]];\nlet sel=null,done=0;\nI.forEach((it,i)=>{\n  const e=document.createElement(\"div\");e.className=\"item\";e.textContent=it[0];e.dataset.i=i;$(\"items\").appendChild(e);\n  let x0,y0,drag=false;\n  e.onpointerdown=ev=>{x0=ev.clientX;y0=ev.clientY;drag=true;e.setPointerCapture(ev.pointerId)};\n  e.onpointermove=ev=>{if(drag)e.style.transform=\"translate(\"+(ev.clientX-x0)+\"px,\"+(ev.clientY-y0)+\"px)\"};\n  e.onpointerup=ev=>{\n    if(!drag)return;drag=false;\n    const moved=Math.hypot(ev.clientX-x0,ev.clientY-y0)>10;\n    e.style.pointerEvents=\"none\";\n    const t=document.elementFromPoint(ev.clientX,ev.clientY);\n    e.style.pointerEvents=\"\";e.style.transform=\"\";\n    if(moved&&t&&t.closest(\".tool\"))place(i,t.closest(\".tool\").dataset.k);\n    else if(!moved){sel=(sel===i)?null:i;document.querySelectorAll(\".item\").forEach(n=>n.classList.toggle(\"sel\",+n.dataset.i===sel));\n      $(\"gm\").textContent=sel===null?\"\":\"Endi mos asbobni bos 👆\"}\n  };\n});\nfunction place(i,k){\n  const it=I[i],m=$(\"gm\"),el=document.querySelector('.item[data-i=\"'+i+'\"]');\n  sel=null;document.querySelectorAll(\".item\").forEach(n=>n.classList.remove(\"sel\"));\n  if(it[1]===k){\n    m.innerHTML='\u003cspan class=\"good\">✅ Toʻgʻri! '+it[0]+\" — \"+T[k][0]+\" bilan.\u003c/span>\";\n    el.remove();const t=document.querySelector('.tool[data-k=\"'+k+'\"]');\n    t.classList.add(\"hit\");t.querySelector(\".pl\").textContent=it[0];\n    if(++done===I.length)m.innerHTML='\u003cspan class=\"good\">🏆 Barakalla! Hammasini topding!\u003c/span>';\n  }else m.innerHTML='\u003cspan class=\"soft\">💡 '+it[2]+\" Yana urinib koʻr!\u003c/span>\";\n}\n/* virtual chizgʻich */\nlet L=0;\n(function(){ // boʻlinmalar chizish: 0..16 sm\n  const r=$(\"rl\");\n  for(let i=0;i\u003c=16;i++){\n    const t=document.createElement(\"div\");t.className=\"t\";t.style.left=\"calc(\"+(i/16*100)+\"% - 1px)\";t.style.height=i%5?\"22px\":\"34px\";r.appendChild(t);\n    const n=document.createElement(\"div\");n.className=\"n\";n.style.left=(i/16*100)+\"%\";n.style.marginLeft=i?\"0\":\"8px\";n.textContent=i;r.appendChild(n)}\n  const o=document.createElement(\"div\");o.className=\"obj\";o.id=\"ob\";r.appendChild(o);\n})();\nfunction newRuler(){L=3+Math.floor(Math.random()*12);$(\"ob\").style.width=(L/16*100)+\"%\";$(\"ans\").value=\"\";$(\"rm\").textContent=\"\"}\n$(\"chk\").onclick=()=>{\n  const v=+$(\"ans\").value;if(!$(\"ans\").value)return;\n  $(\"rm\").innerHTML=v===L?'\u003cspan class=\"good\">⭐ Toʻgʻri! '+L+' sm\u003c/span>':'\u003cspan class=\"soft\">Yana qara: buyumning oxiri qaysi raqamga toʻgʻri keladi?\u003c/span>'};\n$(\"nx\").onclick=newRuler;newRuler();\n\n/* ===== 3-boʻlim ===== */\n[[\"1 sm = 10 mm\",\"mm\"],[\"1 dm = 10 sm\",\"sm\"],[\"1 m = 100 sm (10 dm)\",\"dm\"],[\"1 km = 1000 m\",\"100 m\"]].forEach(([t,p])=>{\n  const h=document.createElement(\"div\");h.innerHTML=\"\u003cb>\"+t+\"\u003c/b>\u003cdiv class='join'>\"+\"\u003cspan>\u003c/span>\".repeat(10)+\"\u003c/div>\";$(\"joins\").appendChild(h)});\n$(\"jb\").onclick=()=>{\n  const g=document.querySelectorAll(\".join\"),on=!g[0].classList.contains(\"go\");\n  g.forEach((j,i)=>setTimeout(()=>j.classList.toggle(\"go\",on),i*300));\n  $(\"jb\").textContent=on?\"↔ Ajratish\":\"🧲 Yigʻish\"};\n/* oʻzgartirgich */\nconst F=[1,10,100,1000,1e6],UN=[\"mm\",\"sm\",\"dm\",\"m\",\"km\"];\nlet shown=[0,0,0,0,0];\nfunction conv(){\n  const v=+$(\"cn\").value||0,u=+$(\"cu\").value,mm=v*F[u];\n  $(\"cv\").innerHTML=UN.map((n,i)=>\"\u003cdiv>\u003cspan>\"+n+\"\u003c/span>\u003cspan id='c\"+i+\"'>\"+shown[i]+\"\u003c/span>\u003c/div>\").join(\"\");\n  const t0=performance.now(),from=shown.slice(),to=F.map(f=>mm/f);\n  (function step(t){\n    const p=Math.min((t-t0)/500,1);\n    to.forEach((x,i)=>{shown[i]=+(from[i]+(x-from[i])*p).toFixed(6);const e=$(\"c\"+i);if(e)e.textContent=p\u003c1?shown[i]:+x.toFixed(6)});\n    if(p\u003c1)requestAnimationFrame(step);\n  })(t0);\n}\n$(\"cn\").oninput=$(\"cu\").onchange=conv;conv();\n/* mini-test: 8 mashq, oddiydan murakkabga */\nconst Q=[[\"3 m = ? sm\",300],[\"40 mm = ? sm\",4],[\"5 dm = ? sm\",50],[\"2 sm = ? mm\",20],[\"400 sm = ? m\",4],[\"3 km = ? m\",3000],[\"2000 m = ? km\",2],[\"2 m 30 sm = ? sm\",230]];\nlet qi=0,sc=0;\nfunction stars(){$(\"st\").textContent=\"⭐\".repeat(sc)+\"☆\".repeat(Q.length-sc)}\nfunction ask(){\n  stars();\n  if(qi>=Q.length){$(\"qz\").innerHTML=\"\u003ch3>Natija: \"+sc+\" / \"+Q.length+\" ball \"+(sc>6?\"🏆\":sc>3?\"👍\":\"💪\")+\"\u003c/h3>\u003cbutton class='warm' id='ag'>Qaytadan\u003c/button>\";\n    $(\"ag\").onclick=()=>{qi=0;sc=0;ask()};return}\n  $(\"qz\").innerHTML=\"\u003ch3>\"+(qi+1)+\"/\"+Q.length+\": \"+Q[qi][0]+\"\u003c/h3>\u003cdiv class='row'>\u003cinput type='number' id='qa' inputmode='numeric'>\u003cbutton class='alt' id='qb'>Tekshirish\u003c/button>\u003c/div>\u003cdiv class='msg' id='qm'>\u003c/div>\";\n  $(\"qb\").onclick=()=>{\n    if(!$(\"qa\").value)return;\n    const ok=+$(\"qa\").value===Q[qi][1];\n    if(ok)sc++;\n    $(\"qm\").innerHTML=ok?'\u003cspan class=\"good\">⭐ Toʻgʻri!\u003c/span>':'\u003cspan class=\"soft\">Toʻgʻri javob: '+Q[qi][1]+'\u003c/span>';\n    stars();$(\"qb\").disabled=true;qi++;setTimeout(ask,1300)};\n}\nask();show(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}]</script>
<script>
(function(){
  var T=JSON.parse(document.getElementById('d').textContent);
  var stage=document.getElementById('stage'),home=document.getElementById('home');
  var list=document.getElementById('list'),cards=document.getElementById('cards');

  var frames={},btns=[];
  function item(icon,text,i){
    var b=document.createElement('button');
    var n=document.createElement('span');n.className='n';n.textContent=icon;

    list.appendChild(b);btns[i]=b;

  item('🏠','Bosh sahifa',0);

    item(t.icon,(k+1)+'. '+t.title,k+1);

    c.children[0].textContent=t.icon;c.children[1].textContent=t.title;c.children[2].textContent=(k+1)+'-mavzu';
    c.onclick=function(){go(k+1)};cards.appendChild(c);

  burger.onclick=function(){toggle(true)};

  }
  function fromHash(){var n=parseInt(location.hash.slice(1),10);return isNaN(n)?0:n}

})();
